[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-bleed-shield"
version = "0.1.0"
description = "Preventive workflow to stop bleeding AI API costs before generation starts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "asinfer", email = "puneet.pranav04@gmail.com" }
]
keywords = [
    "ai",
    "llm",
    "token-optimization",
    "cost-prevention",
    "agentic-workflows",
    "preflight",
    "mcp",
    "context-window"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
tbs = "token_bleed_shield.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/token_bleed_shield"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set so `ruff check` is a meaningful gate in CI.
#   E4/E7/E9 - pycodestyle errors that indicate real defects
#   F        - pyflakes: unused imports, undefined names, unused variables
#   I        - import sorting
# The broader pyupgrade/bandit families are deliberately not enabled yet: adopting them
# would rewrite type-hint style across the whole codebase in a behaviour-neutral but
# review-hostile diff. See todo.md -> "Backlog".
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["token_bleed_shield"]
