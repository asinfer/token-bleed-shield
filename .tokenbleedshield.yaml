# Token Bleed Shield: Preventive Policy Configuration
#
# Enforcement levels: block | warn | ask | off
#   block - prevent the action before it executes
#   warn  - report it and let the action proceed
#   ask   - escalate to a human for an explicit decision
#   off   - ignore the rule

prober:
  prefer_uv: true
  prefer_pnpm: true
  include_git_info: true
  include_os_details: true
  contract_filename: ".agent-env.md"

tool_linter:
  strip_titles: true
  strip_examples: false
  max_description_length: 140
  prune_empty_fields: true

budget_gate:
  max_context_tokens: 32000
  warn_threshold_tokens: 24000
  char_per_token_ratio: 3.8
  reject_oversized: false

circuit_breaker:
  # Tolerated repeats before a signal fires.
  max_consecutive_same_tools: 2
  max_identical_tool_args: 1
  max_consecutive_errors: 3
  max_repeated_error_signature: 2
  sliding_window_size: 6

  default_enforcement: warn

  rules:
    forbidden_command:
      enforcement: block
    identical_args:
      enforcement: block
    repeated_error_signature:
      enforcement: warn
    error_cascade:
      enforcement: warn
    same_tool_streak:
      enforcement: warn
    oscillation:
      enforcement: warn
